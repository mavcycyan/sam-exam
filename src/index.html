<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Examination questionnaire</title>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в экзаменационный опросник!</h1>

        <div class="navbar">
            <button class="nav_btn">&#60;</button>
            <button class="nav_btn">&#62;</button>
            <div class="progress_bar">
                <span></span>
            </div>
            <div class="steps">
                <span class="cur">0</span> / <span class="all">33</span>
            </div>
        </div>

        <div class="desk">
            <div class="desk-quastion">Сколько будет 2 + 2 ? (2 балла)</div>
            <div class="desk-asnswers">
                <div class="answer">
                    <input id="q1" type="radio" value="one1" name="step1">
                    <label for="q1">
                        <span>5</span>
                    </label>
                </div>
                <div class="answer">
                    <input id="q2" type="radio" value="one2" name="step1">
                    <label for="q2">
                        <span>4</span>
                    </label>
                </div>
                <div class="answer">
                    <input id="q3" type="radio" value="one3" name="step1">
                    <label for="q3">
                        <span>Я не знаю!</span>
                    </label>
                </div>
            </div>
        </div>
        <button class="btn">Подтвердить</button>
    </div>

    <div id="app"></div>

</body>
</html>
